name: Sitewide Practice Data Copy Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sitewide-practice-copy-audit.yml'
      - 'scripts/qa/sitewide-ui-provenance-audit-v1.mjs'
permissions:
  contents: read
jobs:
  source-copy-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/qa/sitewide-ui-provenance-audit-v1.mjs

name: Knowledge Library V1 — Membership + Admin
on:
  push:
    branches: [main, feature/knowledge-library-membership-admin-v1, feature/knowledge-standalone-article-pages-v1, fix/knowledge-article-responsive-layout-v2, feature/knowledge-articles-batch002-50-20261103, feature/knowledge-batch003-50-all-sources-20261103]
    paths:
      - 'functions/api/knowledge-library.js'
      - 'admin-knowledge.html'
      - 'knowledge-database.html'
      - 'knowledge-article.html'
      - 'talia-classroom.html'
      - 'assets/js/talia-kdb-runner-v1.js'
      - 'assets/js/talia-kdb-remaining-runner-v1.js'
      - 'assets/css/talia-kdb-guided-v1.css'
      - 'tests/kdb-classroom-product-boundary-v1.test.mjs'
      - 'assets/js/knowledge-article-page-v1.js'
      - 'assets/css/knowledge-article-page-v1.css'
      - 'tests/test_knowledge_article_standalone_v1.mjs'
      - 'tests/test_knowledge_article_batch002_v1.mjs'
      - 'data/knowledge/batch002-*.json'
      - 'data/knowledge/batch003-*.json'
      - 'tests/test_knowledge_article_batch003_v1.mjs'
      - 'docs/knowledge/SMFGU-KDB-BATCH003-050-20261103.md'
      - 'supabase/migrations/20261103_knowledge_batch003_full_registry_v1.sql'
      - 'docs/knowledge/SMFGU-KDB-BATCH002-050-20261103.md'
      - 'supabase/migrations/20261103_knowledge_article_batch002_authoring_v1.sql'
      - 'admin.html'
      - 'assets/js/admin-knowledge-v1.js'
      - 'assets/js/knowledge-article-library-v1.js'
      - 'assets/css/admin-knowledge-v1.css'
      - 'assets/css/knowledge-article-library-v1.css'
      - 'supabase/migrations/20261102_knowledge_library_membership_admin_v1.sql'
      - 'tests/test_knowledge_library_membership_admin_v1.mjs'
      - 'tests/test_knowledge_library_runtime_auth_v1.mjs'
      - '.github/workflows/knowledge-library-membership-admin-v1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verified-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate Cloudflare and browser JavaScript syntax
        run: |
          node --check functions/api/knowledge-library.js
          node --check assets/js/knowledge-article-library-v1.js
          node --check assets/js/knowledge-article-page-v1.js
          node --check assets/js/admin-knowledge-v1.js
      - name: Verify security and curriculum nonregression
        run: |
          node --test tests/kdb-classroom-product-boundary-v1.test.mjs
          node tests/test_knowledge_library_membership_admin_v1.mjs
          node tests/test_knowledge_article_standalone_v1.mjs
          node tests/test_knowledge_article_batch002_v1.mjs
          node tests/test_knowledge_article_batch003_v1.mjs
          node tests/test_knowledge_library_runtime_auth_v1.mjs
          node tests/test_knowledge_database_store_v1.mjs
          node tests/test_knowledge_database_expansion_v2.mjs

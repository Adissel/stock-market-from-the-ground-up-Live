name: One-time main-only branch cleanup (owner authorized)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-main-only-cleanup-20261104.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  consolidate:
    if: github.repository == 'Adissel/stock-market-from-the-ground-up-Live' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Archive unique commits and delete non-main branches
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, os, sys, urllib.request, urllib.error, urllib.parse
          ROOT="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]
          TOKEN=os.environ["GH_TOKEN"]
          H={"Authorization":"Bearer "+TOKEN,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"one-branch-cleanup-20261104"}
          def api(method,path,obj=None):
              data=None if obj is None else json.dumps(obj).encode()
              req=urllib.request.Request(ROOT+path,data=data,headers=H,method=method)
              with urllib.request.urlopen(req,timeout=30) as res:
                  out=res.read()
              return json.loads(out) if out else None
          def refpath(name):
              return urllib.parse.quote(name,safe="/")
          def branch_map():
              out={}
              page=1
              while True:
                  rows=api("GET","/branches?per_page=100&page="+str(page))
                  for b in rows:
                      out[b["name"]]={"sha":b["commit"]["sha"],"protected":b.get("protected",False)}
                  if len(rows)<100:break
                  page+=1
                  if page>10:raise RuntimeError("Unanticipated branch inventory size")
              return out
          def summary(line):
              print(line,flush=True)
              with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:f.write(line+"\n")
          assert os.environ["GITHUB_REPOSITORY"]=="Adissel/stock-market-from-the-ground-up-Live"
          assert os.environ["GITHUB_REF"]=="refs/heads/main"
          snapshot_raw=api("GET","/contents/ops/branch-consolidation/2026-11-04-precleanup-snapshot.json?ref=main")
          snapshot=json.loads(base64.b64decode(snapshot_raw["content"]).decode())
          expected={x["branch"]:x["sha"] for x in snapshot["branches"] if x["branch"]!="main"}
          live=branch_map()
          summary("## Owner-authorized consolidation to one branch: main")
          summary("Snapshot contains "+str(len(expected))+" non-main branch references.")
          if "main" not in live:raise RuntimeError("main is absent; refusing changes")
          extra=set(live)-set(expected)-{"main"}
          changed={n:(expected[n],live[n]["sha"]) for n in expected if n in live and expected[n]!=live[n]["sha"]}
          if changed:
              summary("STOP: branch tips changed after archival snapshot: "+str(changed))
              raise RuntimeError("Branch updates require a new archival review. No branches deleted.")
          if extra:
              summary("Additional branches created after snapshot: "+", ".join(sorted(extra))+". They will also be archived before deletion.")
              for name in extra:
                  expected[name]=live[name]["sha"]
          if any(live[n]["protected"] for n in expected if n in live):
              raise RuntimeError("Protected non-main branches found: inspect before deletion.")
          pr_rows=api("GET","/pulls?state=open&per_page=100")
          pr_heads={p["head"]["ref"]:p["number"] for p in pr_rows if p["head"]["repo"] and p["head"]["repo"]["full_name"]==os.environ["GITHUB_REPOSITORY"]}
          archive=[]
          pruned=[]
          for name in sorted(expected):
              if name not in live:continue
              cmp=api("GET","/compare/main..."+urllib.parse.quote(name,safe="/"))
              ahead=cmp.get("ahead_by")
              if ahead is None:raise RuntimeError("No comparison for "+name)
              if ahead>0 or name in pr_heads:
                  archive.append((name,expected[name],ahead))
              pruned.append((name,expected[name],ahead))
          summary("Preflight: "+str(len(archive))+" branch heads need preserved archive tags; "+str(len(pruned))+" non-main branches eligible for deletion.")
          tag_prefix="archive/one-branch-20261104/"
          for name,sha,ahead in archive:
              tag=tag_prefix+name
              tag_url="/git/ref/tags/"+refpath(tag)
              try:
                  found=api("GET",tag_url)
                  if found["object"]["sha"]!=sha:raise RuntimeError("Archive tag collision: "+tag)
              except urllib.error.HTTPError as exc:
                  if exc.code!=404:raise
                  api("POST","/git/refs",{"ref":"refs/tags/"+tag,"sha":sha})
              verified=api("GET",tag_url)
              if verified["object"]["sha"]!=sha:raise RuntimeError("Tag verification failed for "+name)
          summary("Preservation complete: "+str(len(archive))+" archive tags verified. Deletion permitted.")
          deleted=[]
          failures=[]
          for name,sha,ahead in pruned:
              try:
                  current=api("GET","/git/ref/heads/"+refpath(name))
                  if current["object"]["sha"]!=sha:raise RuntimeError("Head changed during cleanup, refused: "+name)
                  api("DELETE","/git/refs/heads/"+refpath(name))
                  deleted.append(name)
              except Exception as e:
                  failures.append((name,str(e)))
          summary("Deleted "+str(len(deleted))+" branches. Failures: "+str(len(failures))+".")
          for name,err in failures:summary("- Failed: "+name+" — "+err[:250])
          remaining=branch_map()
          summary("Remaining branch names: "+", ".join(sorted(remaining)))
          if set(remaining)!={"main"}:raise RuntimeError("One-branch verification failed; see job summary.")
          summary("**PASS: Only main remains.** Unique branch history remains reachable through archive tags, not merged into main.")
          PY

          node --check functions/_lib/academy-foundations30-guided-days21-30-v1.js
          node --check functions/_lib/academy-foundations30-guided-240-v1.js
          node tests/test_academy_foundations30_guided240_v1.mjs
          node scripts/academy-274-advanced-readiness-preflight-v1.mjs
          node tests/test_academy_guided_v1.mjs
          node tests/test_academy_three_camps_completion_contract_v1.mjs
          node tests/test_v135_public_assessment_projection.mjs
          node tests/test_v014168_academy_family.mjs
          node tests/test_v014144_bootcamp.mjs
          node tests/test_v014162_bootcamp_v32.mjs
          node --check tests/test_v014168_academy_browser.mjs
          node --check tests/test_v014144_bootcamp_browser.mjs
      - name: Build deployment-equivalent Pages files
        run: |
          bash scripts/build-pages.sh
          test -f public/assets/css/teaching-full-width-v1.css
          test -f public/bootcamp-academy.html
          test -f public/bootcamp.html
          test ! -d public/supabase
          test ! -d public/functions
      - name: Install pinned open-source Chromium test runtime
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start isolated local static site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public >/tmp/gu-bootcamp-layout.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/bootcamp-academy.html >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/bootcamp.html >/dev/null
      - name: Browser-verify six Academy routes at four viewports, including first and final study day
        env:
          SITEWIDE_TEST_BASE: http://127.0.0.1:8765
        run: node tests/test_v014168_academy_browser.mjs
      - name: Browser-verify Risk60 advanced original Days 11 and 14 at mobile, tablet, desktop
        env:
          SITEWIDE_TEST_BASE: http://127.0.0.1:8765
        run: node tests/test_risk60_advanced_days11_14_browser_v1.mjs
      - name: Browser-verify 40 advanced original Risk60 teaching days across three responsive widths
        env:
          SITEWIDE_TEST_BASE: http://127.0.0.1:8765
        run: node tests/test_academy_risk60_days21_60_browser_v1.mjs
      - name: Browser-verify Charts45 original Days 01–45 across three viewport widths
        env:
          SITEWIDE_TEST_BASE: http://127.0.0.1:8765
        run: node tests/test_academy_charts45_days01_40_browser_v1.mjs
      - name: Browser-verify Practicum90 advanced Days 01–80 across three viewport widths
        env:
          SITEWIDE_TEST_BASE: http://127.0.0.1:8765
        run: node tests/test_academy_practicum90_days01_20_browser_v1.mjs
      - name: Browser-verify all three new Boot Camp routes at mobile and desktop widths
        env:
          SITEWIDE_TEST_BASE: http://127.0.0.1:8765
        run: node tests/test_academy_three_camps_browser_v1.mjs
      - name: Browser-verify canonical 30-day Boot Camp at mobile and desktop widths
        env:
          SITEWIDE_TEST_BASE: http://127.0.0.1:8765
        run: node tests/test_v014144_bootcamp_browser.mjs

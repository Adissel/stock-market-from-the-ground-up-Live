  contents: read
jobs:
  verify-all-bootcamps:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all seven programs and independent Free Foundations path
        run: |
          node tests/test_teaching_full_width_v1.mjs
          node --check functions/api/academy-protected-assessment-v1.js
          node --check functions/api/bootcamp-academy.js
          node --check functions/_lib/academy-three-camps-beta-access-v1.js

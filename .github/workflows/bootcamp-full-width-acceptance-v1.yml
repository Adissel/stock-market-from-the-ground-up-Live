          node tests/test_academy_foundations30_depth_days01_10_v1.mjs
          node --check functions/_lib/academy-foundations30-depth-days11-20-v1.js
          node tests/test_academy_foundations30_depth_days11_20_v1.mjs
          node --check functions/_lib/academy-foundations30-depth-days21-30-v1.js
          node tests/test_academy_foundations30_depth_days21_30_v1.mjs

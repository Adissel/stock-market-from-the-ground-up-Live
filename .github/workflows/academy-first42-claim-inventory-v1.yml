name: Academy First-42 Sentence-Level Evidence Inventory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/academy-first42-claim-inventory-v1.yml'
      - 'scripts/academy-first42-claim-inventory-v1.mjs'
      - 'functions/_lib/bootcamp-academy-v014168.js'
      - 'functions/_lib/academy-first22-teaching-v1.js'
      - 'functions/_lib/academy-foundations-batch02-v1.js'
      - 'functions/_lib/bootcamp-curriculum-v014144.js'
permissions: {contents: read}
jobs:
  generate-source-review-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check scripts/academy-first42-claim-inventory-v1.mjs
          node scripts/academy-first42-claim-inventory-v1.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: academy-first42-complete-sentence-claim-queue
          path: |
            artifacts/bootcamp-first42-claim-inventory.csv
            artifacts/bootcamp-first42-claim-inventory-manifest.json

name: Crownlight Prototype Center V1
on:
  push:
    branches: [main]
    paths:
      - 'prototype.html'
      - 'src/prototype/PrototypeExperiences.tsx'
      - 'assets/js/prototype-experiences-boot-v1.js'
      - 'assets/css/prototype-experiences-v1.css'
      - 'tests/prototype-experiences-v1.test.mjs'
      - 'tests/prototype-indicator-workbench-v2.test.mjs'
      - 'assets/js/prototype-indicator-workbench-v2.js'
      - 'assets/js/prototype-curriculum-parity-v1.js'
      - 'assets/css/prototype-curriculum-parity-v1.css'
      - 'tests/prototype-curriculum-parity-v1.test.mjs'
      - 'scripts/guided-platform-quality-audit-v1.mjs'
      - 'data/lab-teaching-bridges-v014168.json'
      - 'docs/learning/SMFGU-LAB-BATCH02-20261101.json'
      - 'tests/lab-batch02-source-v1.test.mjs'
      - 'tests/prototype-experiences-v1-browser.test.mjs'
      - 'src/prototype/PrototypeThreeLab.tsx'
      - 'src/prototype/PrototypeWorkbenchDeck.tsx'
      - 'assets/css/prototype-center-v6.css'
      - 'assets/css/prototype-center-v7.css'
      - 'tests/prototype-center-v7-terminal.test.mjs'
      - 'tests/prototype-center-v6-ui.test.mjs'
      - 'assets/css/prototype-three-lab-v1.css'
      - 'tests/prototype-three-lab-v1.test.mjs'
      - 'scripts/build-pages.sh'
      - 'assets/css/prototype-center-v1.css'
      - 'assets/js/prototype-center-v1.js'
      - 'assets/js/prototype-admin-link-v1.js'
      - 'assets/js/route-policy.js'
      - 'admin.html'
      - '_headers'
      - 'tests/prototype-center-v1-contract.test.mjs'
      - 'tests/prototype-center-v1-auth.test.mjs'
      - 'tests/prototype-teaching-v2.test.mjs'
      - 'tests/prototype-center-v2-browser.test.mjs'
      - 'tests/prototype-membership-builder-v1.test.mjs'
      - 'assets/js/prototype-membership-builder-v1.js'
      - 'assets/js/prototype-preset-sync-v1.js'
      - 'functions/api/prototype-classroom-presets.js'
      - 'tests/prototype-classroom-registry-v1.test.mjs'
      - 'supabase/migrations/20261101_cl_classroom_design_registry_v1.sql'
      - 'assets/js/prototype-teaching-v2.js'
      - 'functions/api/prototype-training-cases.js'
      - 'functions/api/prototype-document.js'
      - 'functions/_middleware.js'
      - 'assets/js/prototype-bootstrap-v3.js'
      - 'tests/prototype-private-document-v3.test.mjs'
      - '.github/workflows/prototype-center-v1.yml'
  pull_request:
    paths:
      - 'assets/js/prototype-center-v1.js'
      - 'assets/css/prototype-center-v7.css'
      - 'tests/prototype-center-v2-browser.test.mjs'
      - '.github/workflows/prototype-center-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prototype-source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check assets/js/prototype-center-v1.js
          node --check assets/js/prototype-experiences-boot-v1.js
          node --check assets/js/prototype-indicator-workbench-v2.js
          node --check assets/js/prototype-curriculum-parity-v1.js
          node --check assets/js/prototype-admin-link-v1.js
          node --check assets/js/prototype-teaching-v2.js
          node --check assets/js/prototype-membership-builder-v1.js
          node --check assets/js/prototype-preset-sync-v1.js
          node --check functions/api/prototype-classroom-presets.js
          node --check functions/api/prototype-training-cases.js
          node --check functions/api/prototype-document.js
          node --check functions/_middleware.js
          node --check assets/js/prototype-bootstrap-v3.js
          node --check assets/js/route-policy.js
      - name: Verify Prototype Center source contracts
        run: |
          node tests/prototype-center-v1-contract.test.mjs
          node tests/prototype-center-v1-auth.test.mjs
          node tests/prototype-three-lab-v1.test.mjs
          node tests/prototype-center-v6-ui.test.mjs
          node tests/prototype-center-v7-terminal.test.mjs
          node tests/prototype-experiences-v1.test.mjs
          node tests/prototype-indicator-workbench-v2.test.mjs
          node tests/prototype-curriculum-parity-v1.test.mjs
          node scripts/guided-platform-quality-audit-v1.mjs
          node tests/lab-batch02-source-v1.test.mjs
          node tests/prototype-teaching-v2.test.mjs
          node tests/prototype-private-document-v3.test.mjs
          node tests/prototype-membership-builder-v1.test.mjs
          node tests/prototype-classroom-registry-v1.test.mjs
      - name: Build exact public Cloudflare Pages output and verify private-source exclusions
        run: |
          bash scripts/build-pages.sh
          test -s public/prototype.html
          test -s public/assets/js/prototype-experiences-v1.bundle.js
          test -s public/assets/js/prototype-indicator-workbench-v2.js
          test -s public/assets/js/prototype-curriculum-parity-v1.js
          test -s public/assets/css/prototype-curriculum-parity-v1.css
          test -s public/assets/css/prototype-experiences-v1.css
          test -s public/assets/js/prototype-teaching-v2.js
          test -s public/assets/vendor/echarts/6.1.0/echarts.min.js
          test -s public/assets/js/prototype-three-lab-v1.bundle.js
          test -s public/assets/js/prototype-deck-v6.bundle.js
          test -s public/assets/css/prototype-center-v6.css
          test -s public/assets/css/prototype-center-v7.css
          test -s public/assets/vendor/three/LICENSE
          test -s public/assets/vendor/react/LICENSE
          test ! -d public/functions
          test ! -d public/supabase
          test ! -d public/tests
      - name: Install pinned free Chromium test runner
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Browser-check Owner/Admin and denied roles at desktop, tablet and mobile widths
        run: |
          python3 -m http.server 8768 --bind 127.0.0.1 --directory public >/tmp/prototype-v2-browser.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8768/prototype.html >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8768/prototype.html >/dev/null
          node tests/prototype-center-v2-browser.test.mjs
          node tests/prototype-experiences-v1-browser.test.mjs

      - name: Retain read-only guided-learning source-quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Guided-Platform-Source-Quality-${{ github.run_number }}
          path: artifacts/guided-platform-quality-audit-v1.json
          if-no-files-found: warn
          retention-days: 30

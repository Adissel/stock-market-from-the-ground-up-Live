name: Crownlight Prototype Center V1
on:
  push:
    branches: [main]
    paths:
      - 'prototype.html'
      - 'assets/css/prototype-center-v1.css'
      - 'assets/js/prototype-center-v1.js'
      - 'assets/js/prototype-admin-link-v1.js'
      - 'assets/js/route-policy.js'
      - 'admin.html'
      - '_headers'
      - 'tests/prototype-center-v1-contract.test.mjs'
      - 'tests/prototype-center-v1-auth.test.mjs'
      - 'tests/prototype-teaching-v2.test.mjs'
      - 'tests/prototype-center-v2-browser.test.mjs'
      - 'assets/js/prototype-teaching-v2.js'
      - 'functions/api/prototype-training-cases.js'
      - 'functions/api/prototype-document.js'
      - 'functions/_middleware.js'
      - 'assets/js/prototype-bootstrap-v3.js'
      - 'tests/prototype-private-document-v3.test.mjs'
      - '.github/workflows/prototype-center-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prototype-source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check assets/js/prototype-center-v1.js
          node --check assets/js/prototype-admin-link-v1.js
          node --check assets/js/prototype-teaching-v2.js
          node --check functions/api/prototype-training-cases.js
          node --check functions/api/prototype-document.js
          node --check functions/_middleware.js
          node --check assets/js/prototype-bootstrap-v3.js
          node --check assets/js/route-policy.js
      - name: Verify Prototype Center source contracts
        run: |
          node tests/prototype-center-v1-contract.test.mjs
          node tests/prototype-center-v1-auth.test.mjs
          node tests/prototype-teaching-v2.test.mjs
          node tests/prototype-private-document-v3.test.mjs
      - name: Build exact public Cloudflare Pages output and verify private-source exclusions
        run: |
          bash scripts/build-pages.sh
          test -s public/prototype.html
          test -s public/assets/js/prototype-teaching-v2.js
          test -s public/assets/vendor/echarts/6.1.0/echarts.min.js
          test ! -d public/functions
          test ! -d public/supabase
          test ! -d public/tests
      - name: Install pinned free Chromium test runner
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Browser-check Owner/Admin and denied roles at desktop, tablet and mobile widths
        run: |
          python3 -m http.server 8768 --bind 127.0.0.1 --directory public >/tmp/prototype-v2-browser.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8768/prototype.html >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8768/prototype.html >/dev/null
          node tests/prototype-center-v2-browser.test.mjs

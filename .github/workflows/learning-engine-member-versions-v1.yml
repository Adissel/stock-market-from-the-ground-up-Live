name: Learning Engine Membership Versions
on:
  push:
    branches: [main]
    paths:
      - 'assets/learning-versions/**'
      - 'assets/js/member-learning-engine-versions-v1.js'
      - 'assets/js/member-tutor-version-loader-v1.js'
      - 'assets/js/admin-learning-engine-versions-v1.js'
      - 'functions/api/admin-learning-engine-versions.js'
      - 'functions/api/member-learning-engine-versions.js'
      - 'supabase/migrations/20261101_membership_learning_engine_versions_v1.sql'
      - 'tests/learning-engine-member-versions-v1.test.mjs'
      - 'tests/learning-engine-member-versions-api-v1.test.mjs'
      - 'lab-player.html'
      - 'market-tutor.html'
      - 'admin.html'
  workflow_dispatch:
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source syntax
        run: |
          node --check functions/api/admin-learning-engine-versions.js
          node --check functions/api/member-learning-engine-versions.js
          node --check assets/js/admin-learning-engine-versions-v1.js
          node --check assets/js/member-learning-engine-versions-v1.js
          node --check assets/js/member-tutor-version-loader-v1.js
      - name: Contracts
        run: node --test tests/learning-engine-member-versions-v1.test.mjs tests/learning-engine-member-versions-api-v1.test.mjs

name: Learning Engine Membership Versions
on:
  push:
    branches: [main]
    paths:
      - 'assets/learning-versions/**'
      - 'assets/js/member-learning-engine-versions-v1.js'
      - 'scripts/learning-echarts-beta-audit-v1.mjs'
      - 'assets/js/prototype-curriculum-parity-v1.js'
      - 'tests/prototype-curriculum-parity-v1.test.mjs'
      - 'assets/js/member-tutor-version-loader-v1.js'
      - 'assets/js/admin-learning-engine-versions-v1.js'
      - 'functions/api/admin-learning-engine-versions.js'
      - 'functions/api/member-learning-engine-versions.js'
      - 'functions/_lib/learning-engine-tier-policy-v1.js'
      - 'functions/_lib/engine-classroom-contract-v1.js'
      - 'tests/engine-classroom-contract-v1.test.mjs'
      - 'tests/learning-engine-tier-policy-v1.test.mjs'
      - 'functions/api/market-tutor-v01492.js'
      - 'tests/talia-membership-editions-v1.test.mjs'
      - 'tests/talia-member-foundation-server-v1.test.mjs'
      - 'supabase/migrations/20261101_talia_membership_editions_v1.sql'
      - 'supabase/migrations/20261101_membership_learning_engine_versions_v1.sql'
      - 'tests/learning-engine-member-versions-v1.test.mjs'
      - 'tests/learning-engine-member-versions-api-v1.test.mjs'
      - 'tests/member-engine-owner-interaction-v1.test.mjs'
      - 'lab-player.html'
      - 'market-tutor.html'
      - 'admin.html'
  workflow_dispatch:
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source syntax
        run: |
          node --check functions/api/admin-learning-engine-versions.js
          node --check functions/api/member-learning-engine-versions.js
          node --check functions/_lib/learning-engine-tier-policy-v1.js
          node --check functions/_lib/engine-classroom-contract-v1.js
          node --check functions/api/market-tutor-v01492.js
          node --check assets/js/admin-learning-engine-versions-v1.js
          node --check assets/js/member-learning-engine-versions-v1.js
          node --check assets/js/member-tutor-version-loader-v1.js
      - name: Contracts
        run: node --test tests/learning-engine-member-versions-v1.test.mjs tests/learning-engine-member-versions-api-v1.test.mjs tests/talia-membership-editions-v1.test.mjs tests/talia-member-foundation-server-v1.test.mjs tests/member-engine-owner-interaction-v1.test.mjs tests/engine-classroom-contract-v1.test.mjs
      - name: Ten-camp, 419-Lab and 61-indicator source integrity
        run: |
          node scripts/learning-echarts-beta-audit-v1.mjs
          node tests/prototype-curriculum-parity-v1.test.mjs tests/learning-engine-tier-policy-v1.test.mjs

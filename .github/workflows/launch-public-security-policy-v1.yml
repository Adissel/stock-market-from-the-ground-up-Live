name: Launch Public Security and Policy Smoke (noncharging)
on:
  push:
    branches: [main]
    paths:
      - 'tests/test_launch_public_security_policy_v1.mjs'
      - '.github/workflows/launch-public-security-policy-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  noncharging-production-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public tool authorization boundaries and legal page routing
        run: |
          node --check tests/test_launch_public_security_policy_v1.mjs
          node tests/test_launch_public_security_policy_v1.mjs

# Evidence gates for ungraded premium source candidates.
# This workflow DOES NOT turn on purchases, entitlements or a production release.
name: Learning Lab Editions - Source and Authorization
on:
  push:
    branches: [main]
    paths:
      - 'functions/_lib/learning-lab-edition-exercises-v1.js'
      - 'functions/api/learning-lab-edition-exercise.js'
      - 'tests/learning-lab-edition-exercises-v1.test.mjs'
      - 'tests/learning-lab-edition-api-v1.test.mjs'
      - 'tests/learning-lab-edition-member-surface-v1.test.mjs'
      - 'assets/js/learning-lab-edition-panel-v1.js'
      - 'assets/js/lab-player.js'
      - 'assets/css/learning-lab-edition-panel-v1.css'
      - 'lab-player.html'
      - 'functions/api/learning-lab-edition-workspace.js'
      - 'tests/learning-lab-edition-workspace-v1.test.mjs'
      - 'functions/_lib/learning-lab-enterprise-journey-v1.js'
      - 'functions/_lib/learning-lab-enterprise-case-workbench-v1.js'
      - 'functions/api/learning-lab-enterprise-case-workbench.js'
      - 'tests/learning-lab-enterprise-case-workbench-v1.test.mjs'
      - 'tests/learning-lab-enterprise-case-workbench-api-v1.test.mjs'
      - 'functions/api/learning-lab-enterprise-journey.js'
      - 'tests/learning-lab-enterprise-journey-api-v1.test.mjs'
      - 'tests/enterprise-learning-lab-journey-browser-v1.mjs'
      - 'tests/enterprise-learning-member-journey-browser-v1.mjs'
      - 'assets/js/academy-enterprise-journey-v1.js'
      - 'assets/css/academy-enterprise-journey-v1.css'
      - 'assets/js/bootcamp-academy-v014168.js'
      - 'bootcamp-academy.html'
      - 'tests/enterprise-learning-lab-source-closeout-v1.test.mjs'
      - 'tests/learning-lab-enterprise-journey-v1.test.mjs'
      - 'tests/learning-lab-edition-two-account-contract-v1.test.mjs'
      - 'tests/advanced-learning-lab-source-closeout-v1.test.mjs'
      - 'tests/advanced-learning-lab-member-surface-browser-v1.mjs'
      - 'tests/professional-learning-lab-member-surface-browser-v1.mjs'
      - 'tests/professional-learning-lab-workspace-browser-v1.mjs'
      - 'tests/professional-learning-lab-source-closeout-v1.test.mjs'
      - 'data/learning-lab-engine-feature-audit-v1.json'
      - 'supabase/migrations/20261102_learning_lab_edition_workspaces_v1.sql'
      - '.github/workflows/learning-lab-premium-editions-v1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'functions/api/learning-lab-edition-exercise.js'
      - 'tests/learning-lab-edition-api-v1.test.mjs'
      - 'functions/api/learning-lab-edition-workspace.js'
      - '.github/workflows/learning-lab-premium-editions-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: learning-lab-editions-${{ github.sha }}
  cancel-in-progress: false
jobs:
  ungraded-math:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify premium function syntax
        run: |
          node --check functions/_lib/learning-lab-edition-exercises-v1.js
          node --check functions/_lib/learning-lab-enterprise-journey-v1.js
          node --check functions/_lib/learning-lab-enterprise-case-workbench-v1.js
          node --check functions/api/learning-lab-enterprise-case-workbench.js
          node --check functions/api/learning-lab-enterprise-journey.js
          node --check functions/api/learning-lab-edition-exercise.js
          node --check functions/api/learning-lab-edition-workspace.js
      - name: Verify source safety and chronology
        run: node --test tests/learning-lab-edition-exercises-v1.test.mjs
      - name: Verify governed Enterprise research stages from canonical Academy data
        run: node --test tests/learning-lab-enterprise-journey-v1.test.mjs
      - name: Verify independent Enterprise fictional research comparisons
        run: node --test tests/learning-lab-enterprise-case-workbench-v1.test.mjs
      - name: Verify Enterprise server authorizations and fail-closed Lab registry
        run: node --test tests/learning-lab-enterprise-journey-api-v1.test.mjs
      - name: Verify Enterprise case workbench authorization and no licensed feeds
        run: node --test tests/learning-lab-enterprise-case-workbench-api-v1.test.mjs
      - name: Verify Enterprise Learning and Lab source closeout without release
        run: node --test tests/enterprise-learning-lab-source-closeout-v1.test.mjs
      - name: Verify member UI source integration and accessibility fallbacks
        run: node --test tests/learning-lab-edition-member-surface-v1.test.mjs
      - name: Install pinned Chromium test runtime
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify Advanced member surface in Chromium
        run: node tests/advanced-learning-lab-member-surface-browser-v1.mjs
      - name: Verify Professional member surface in Chromium
        run: node tests/professional-learning-lab-member-surface-browser-v1.mjs
      - name: Verify Professional save restore conflicts and second-account denial in Chromium
        run: node tests/professional-learning-lab-workspace-browser-v1.mjs
      - name: Verify Enterprise governed seven-stage navigator in Chromium
        run: node tests/enterprise-learning-lab-journey-browser-v1.mjs
      - name: Verify authenticated Academy Enterprise Learning navigator in Chromium
        run: node tests/enterprise-learning-member-journey-browser-v1.mjs
      - name: Verify browser workbench syntax
        run: |
          node --check assets/js/learning-lab-edition-panel-v1.js
          node --check assets/js/academy-enterprise-journey-v1.js
  grant-revocation-security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify member grants, expiry, forgery and noncharging boundaries
        run: node --test tests/learning-lab-edition-api-v1.test.mjs
      - name: Verify private revisioned premium workspace authorization
        run: node --test tests/learning-lab-edition-workspace-v1.test.mjs
      - name: Verify two-account cross-engine downgrade and revision isolation
        run: node --test tests/learning-lab-edition-two-account-contract-v1.test.mjs
      - name: Verify Advanced source closeout and release boundary
        run: node --test tests/advanced-learning-lab-source-closeout-v1.test.mjs
      - name: Verify Professional source closeout and release boundary
        run: node --test tests/professional-learning-lab-source-closeout-v1.test.mjs
  fail-closed-summary:
    runs-on: ubuntu-latest
    if: always()
    needs: [ungraded-math, grant-revocation-security]
    steps:
      - name: Require all source candidate tests
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import os,json,sys
          results=json.loads(os.environ['RESULTS'])
          print({k:v['result'] for k,v in results.items()})
          if len(results)!=2 or any(v['result']!='success' for v in results.values()):
              sys.exit('Edition source readiness failed or was cancelled')
          print('EDITION SOURCE PASS — not a released entitlement, browser acceptance or production SHA signoff')
          PY

name: Crownlight Lumens Authoritative Catalog and Disabled Gates LIVE QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lumen-live-authoritative-catalog-v1.yml'
      - 'tests/live-lumen-server-catalog-parity-v1.mjs'
      - 'functions/api/learning-reward-preview.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-public-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check live noncharging source
        run: node --check tests/live-lumen-server-catalog-parity-v1.mjs
      - name: Verify published site uses authoritative catalog and earning is disabled
        run: node tests/live-lumen-server-catalog-parity-v1.mjs

  release-source-summary:
    runs-on: ubuntu-latest
    if: always()
    needs: [learning, labs, academy, studio, tutor, governance, beta-next25]
    steps:
      - uses: actions/checkout@v4
      - name: Validate 86 unique source-test commands
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,collections
          workflow=Path('.github/workflows/beta-major-release-01-60-gates.yml').read_text()
          original=workflow.split('  beta-next25:')[0]
          counts=collections.Counter(re.findall(r'^\s*- name: (LEARNING|LABS|ACADEMY|STUDIO|TUTOR|GOVERNANCE) \d{2} - ',original,re.M))
          assert len(counts)==6 and all(v==10 for v in counts.values()),counts
          base=re.findall(r'^\s*run: node (tests/[^\s]+)$',original,re.M)
          extra_text=workflow.split('  beta-next25:')[1].split('  release-source-summary:')[0]
          extra=re.findall(r'^\s*run: node (tests/[^\s]+)$',extra_text,re.M)
          assert len(base)==61 and len(set(base))==61,'Require 60 domain checks plus the Tutor prototype integration check'
          assert len(extra)==25 and len(set(extra))==25,'Require 25 distinct additional tests'
          assert not set(base)&set(extra),'Release gates must not duplicate tests'
          missing=[x for x in base+extra if not Path(x).is_file()]
          assert not missing,('Missing test files',missing)
          print('PASS: 86 distinct existing source tests across 7 jobs')
          PY
      - name: Enforce all seven source jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json,os,sys
          jobs=json.loads(os.environ['NEEDS_JSON'])
          for name,result in sorted(jobs.items()):
              print(name,result['result'])
          if len(jobs)!=7 or any(job['result']!='success' for job in jobs.values()):
              sys.exit('NO-GO: at least one of seven source jobs failed or was cancelled')
          print('PASS: 86 source test commands; member/browser, editorial, licensing, security and deployment require independent acceptance')
          PY

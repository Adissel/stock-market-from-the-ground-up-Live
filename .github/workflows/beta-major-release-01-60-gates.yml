    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: LABS 01 - lab-bridge-batch01-editorial-v1.test.mjs
        run: node tests/lab-bridge-batch01-editorial-v1.test.mjs
      - name: LABS 02 - lab-bridge-batch03-v1.test.mjs
        run: node tests/lab-bridge-batch03-v1.test.mjs
      - name: LABS 03 - lab-bridge-batch04-source-v1.test.mjs

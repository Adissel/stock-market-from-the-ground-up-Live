# Source-only release batch. Passing does not authorize LIVE commerce or certify real-user / editorial acceptance.
name: Beta Major Release 01 - 60 Evidence Gates
on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'functions/**'
      - 'data/**'
      - 'tests/**'
      - '.github/workflows/beta-major-release-01-60-gates.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beta-major-release-01-${{ github.ref }}
  cancel-in-progress: false
jobs:
  learning:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: LEARNING 01 - learning-indicators-v1.test.mjs
        run: node tests/learning-indicators-v1.test.mjs
      - name: LEARNING 02 - basic-atr-bollinger-lessons-v1.test.mjs
        run: node tests/basic-atr-bollinger-lessons-v1.test.mjs
      - name: LEARNING 03 - learning-quant-studies-v1.test.mjs
        run: node tests/learning-quant-studies-v1.test.mjs
      - name: LEARNING 04 - learning-evidence-diagnostic-v1.test.mjs
        run: node tests/learning-evidence-diagnostic-v1.test.mjs
      - name: LEARNING 05 - learning-engine-tier-policy-v1.test.mjs
        run: node tests/learning-engine-tier-policy-v1.test.mjs
      - name: LEARNING 06 - learning-engine-member-versions-v1.test.mjs
        run: node tests/learning-engine-member-versions-v1.test.mjs
      - name: LEARNING 07 - learning-engine-member-versions-api-v1.test.mjs
        run: node tests/learning-engine-member-versions-api-v1.test.mjs
      - name: LEARNING 08 - learning-lab-engine-feature-audit-v1.test.mjs

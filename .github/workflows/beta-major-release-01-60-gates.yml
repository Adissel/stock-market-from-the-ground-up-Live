      - name: GOVERNANCE 10 - talia-40-source-register-consistency-v1.test.mjs
        run: node tests/talia-40-source-register-consistency-v1.test.mjs
  release-source-summary:
    runs-on: ubuntu-latest
    if: always()
    needs: [learning, labs, academy, studio, tutor, governance]
    steps:
      - name: Require six complete successful groups and all 60 checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json,os,sys
          results=json.loads(os.environ['NEEDS_JSON'])
          for k,v in results.items():print(k,v['result'])
          if len(results)!=6 or any(v['result']!='success' for v in results.values()):
              sys.exit('BLOCKED: 60-gate beta source batch not accepted')
          print('60 source evidence commands passed; member/browser/security/commerce/editorial and deployment signoffs remain independently required.')
          PY

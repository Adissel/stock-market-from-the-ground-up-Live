# Source-only release batch. Passing does not authorize LIVE commerce or certify real-user / editorial acceptance.
# Release-cut workflow: deliberately triggered by changes to this file or manual dispatch.
# Feature and source commits continue to use their dedicated workflows; this prevents
# rapid main commits from endlessly replacing a single pending 86-command acceptance run.

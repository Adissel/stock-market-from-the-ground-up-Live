name: Crownlight Scanner Wave 5 - Historical Measurements and Indicator Math
on:
  pull_request:
  push:
    branches: [main, feature/crownlight-scanner-wave5-history-indicators-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scanner-history-research:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict historical calculations, source and inputs
        run: |
          node --check assets/js/crownlight-scanner-historical-v5.js
          node --check assets/js/crownlight-scanner-history-view-v5.js
          node --check assets/js/crownlight-scanner-rules-v1.js
          node --check assets/js/advanced-tools.js
          node --test tests/test_crownlight_scanner_historical_v5.mjs tests/test_crownlight_scanner_historical_indicators_v5.mjs tests/test_crownlight_scanner_historical_input_v5.mjs tests/test_crownlight_scanner_historical_source_v5.mjs tests/test_crownlight_scanner_historical_cutoff_v6.mjs
          node tests/test_crownlight_scanner_rules_v1.mjs
          node tests/test_crownlight_scanner_results_v2.mjs
          node tests/test_crownlight_scanner_sec_evidence_v1.mjs
          node tests/test_crownlight_scanner_handoff_v4.mjs
          node tests/test_crownlight_scanner_integration_v4.mjs
          node tests/test_sec_issuer_research_v1.mjs
          node tests/test_v014145_research_scanner.mjs
          node tests/test_v014150_scanner_filters.mjs
      - name: Independently calculate Python versus JavaScript
        run: python3 scripts/qa/crownlight_scanner_historical_reference_v5.py
      - name: Verify Pages build and exclude private source
        run: |
          bash scripts/build-pages.sh
          test -f public/assets/js/crownlight-scanner-historical-v5.js
          test -f public/assets/js/crownlight-scanner-history-view-v5.js
          test -f public/assets/css/crownlight-scanner-history-v5.css
          test ! -d public/functions
          test ! -d public/supabase
          test ! -f public/tests/fixtures/crownlight-scanner-five-minute-v5.csv
          test ! -f public/data/crownlight-scanner-wave5-release-gates.json

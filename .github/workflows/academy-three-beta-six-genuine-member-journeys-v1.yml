name: Academy Three Camps Genuine QA Day Checkpoints
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/academy-three-beta-six-genuine-member-journeys-v1.yml'
      - 'tests/live-academy-three-beta-six-real-member-journeys-v1.mjs'
      - 'functions/api/bootcamp-academy.js'
      - 'functions/_lib/academy-three-camps-v1.js'
      - 'functions/_lib/academy-three-camps-beta-access-v1.js'
      - 'assets/js/bootcamp-academy-v014168.js'
permissions:
  contents: read
  issues: write
concurrency:
  group: academy-three-camps-real-six-journeys
  cancel-in-progress: false
jobs:
  six-distinct-qa-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse genuine-account QA script
        run: node --check tests/live-academy-three-beta-six-real-member-journeys-v1.mjs
      - name: Actual two GoTrue QA users x three invitation-only courses, unused-day resume/save/CAS
        id: journeys
        continue-on-error: true
        env:
          LAB_QA_EMAIL: ${{ secrets.LAB_QA_EMAIL }}
          LAB_QA_PASSWORD: ${{ secrets.LAB_QA_PASSWORD }}
          LAB_QA_SECOND_EMAIL: ${{ secrets.LAB_QA_SECOND_EMAIL }}
          LAB_QA_SECOND_PASSWORD: ${{ secrets.LAB_QA_SECOND_PASSWORD }}
        run: node tests/live-academy-three-beta-six-real-member-journeys-v1.mjs
      - name: Record exact SHA and genuine six-path disposition
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_RESULT: ${{ steps.journeys.outcome }}
        run: |
          {
            echo "### Real two-member x three-camp unused-day private resume/save/CAS API QA"
            echo "Tested SHA: `$GITHUB_SHA`"
            echo "Workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Genuine two-account QA disposition: **$QA_RESULT**."
            echo "A success means two genuine preapproved noncommercial QA identities each preserved old records and passed three new unused-day checkpoints, save/reload, stale CAS, guest denial and foreign-selector isolation; NOT full-course journeys."
            echo "A failure means missing identity/invitation, stale fixture, actual API/DB failure or permissions; it MUST NOT be treated as genuine acceptance."
            echo "No LIVE money, rewards, grades, reviewer claims or production member impersonation authorized."
          } >/tmp/academy-three-six-qa.md
          gh issue comment 157 --repo "$GITHUB_REPOSITORY" --body-file /tmp/academy-three-six-qa.md
      - name: Fail closed when six authenticated day checkpoints are incomplete
        if: steps.journeys.outcome != 'success'
        run: exit 1

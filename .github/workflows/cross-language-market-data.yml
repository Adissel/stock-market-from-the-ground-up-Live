name: Cross-language Market Data Verification
on:
  push:
    branches: [main]
    paths:
      - 'tools/finance/**'
      - 'tools/java/**'
      - '.github/workflows/cross-language-market-data.yml'
  pull_request:
    paths:
      - 'tools/finance/**'
      - 'tools/java/**'
      - '.github/workflows/cross-language-market-data.yml'
jobs:
  python-indicators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/finance/verify_indicators.py
  java-ohlcv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: javac tools/java/src/main/java/org/smfgu/research/MarketDataValidator.java
      - run: java -cp tools/java/src/main/java org.smfgu.research.MarketDataValidator

name: Boot Camp 247 Editorial Preflight
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootcamp-247-editorial-preflight-v1.yml'
      - 'functions/_lib/academy-first22-teaching-v1.js'
      - 'functions/_lib/bootcamp-academy-v014168.js'
      - 'functions/_lib/academy-risk60-learning-batch01-v1.js'
      - 'functions/_lib/academy-risk60-practice-batch02-v1.js'
      - 'assets/js/bootcamp-academy-v014168.js'
      - 'assets/js/academy-guided-v1.js'
      - 'scripts/bootcamp-247-editorial-preflight-v1.mjs'
      - 'tests/test_bootcamp_first22_editorial_preflight_v1.mjs'
      - 'tests/test_academy_risk60_batch01_v1.mjs'
      - 'tests/test_academy_risk60_case_review_20_v1.mjs'
      - 'tests/test_academy_risk60_batch02_v1.mjs'
      - 'tests/test_academy_charts45_batch04_v1.mjs'
      - 'tests/test_academy_practicum90_batch01_v1.mjs'
      - 'tests/test_academy_practicum90_batch02_v1.mjs'
      - 'tests/test_academy_practicum90_all90_v1.mjs'
      - 'functions/_lib/academy-practicum90-batch05-days66-90-v1.js'
      - 'functions/_lib/academy-practicum90-batch04-days46-65-v1.js'
      - 'functions/_lib/academy-practicum90-batch03-days26-45-v1.js'
      - 'functions/_lib/academy-practicum90-learning-batch02-v1.js'
      - 'functions/_lib/academy-practicum90-learning-batch01-v1.js'
      - 'tests/test_academy_risk60_transfer_batch03_v1.mjs'
      - 'functions/_lib/academy-risk60-transfer-batch03-v1.js'
permissions:
  contents: read
  issues: write
jobs:
  original-seven-content:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verified source structural and authored curriculum regressions
        run: |
          node --check assets/js/academy-guided-v1.js
          node --check assets/js/bootcamp-academy-v014168.js
          node tests/test_bootcamp_first22_editorial_preflight_v1.mjs
          node tests/test_academy_charts45_batch04_v1.mjs
          node tests/test_academy_risk60_batch01_v1.mjs
          node tests/test_academy_risk60_case_review_20_v1.mjs
          node tests/test_academy_risk60_batch02_v1.mjs
          node tests/test_academy_practicum90_batch01_v1.mjs
          node tests/test_academy_practicum90_batch02_v1.mjs
          node tests/test_academy_practicum90_all90_v1.mjs
          node tests/test_academy_risk60_transfer_batch03_v1.mjs
          node tests/test_academy_guided_v1.mjs
      - name: Save 247 unit-by-unit nonapproving review register
        uses: actions/upload-artifact@v4
        with:
          name: bootcamp-247-editorial-queue
          path: |
            artifacts/bootcamp-247-editorial-queue.csv
            artifacts/bootcamp-247-batch-manifest.json
      - name: Record passing 247-day authoring evidence (NOT editorial approval)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Original seven Boot Camps — first 20 Risk60 cases CI"
            echo "Tested SHA: \`$GITHUB_SHA\`"
            echo "Workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "PASS only if prior tests and artifact upload completed successfully."
            echo "Coverage: 247-day canonical length, 20 Risk60 authored/unique fictional cases and transfer scenarios, independently recalculated example math, protected grading=false, Charts45 and first-22 regressions, nonapproving review-register export."
            echo "Does NOT constitute 247-day editorial approval, protected grading, human independent assessment, authentic member browser acceptance or proof of historical market-data rights."
          } > /tmp/risk60-ci.md
          gh issue comment 157 --repo "$GITHUB_REPOSITORY" --body-file /tmp/risk60-ci.md
      - name: Record failed 247-day authoring regression without masking failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Risk60 20-day source CI — FAILED; no new authoring acceptance"
            echo "Tested SHA: \`$GITHUB_SHA\`"
            echo "Inspect failing job logs: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "The source/deployment and curriculum acceptance must remain separate. No official grades, 247-day editorial approval or historical replay licensing is implied."
          } > /tmp/risk60-ci-failed.md
          gh issue comment 157 --repo "$GITHUB_REPOSITORY" --body-file /tmp/risk60-ci-failed.md

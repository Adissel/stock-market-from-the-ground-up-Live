name: Crownlight SEC Scanner Batch 2 - Tier Security, Owners and Research
on:
  pull_request:
    paths:
      - 'functions/api/sec-scanner-*.js'
      - 'functions/api/owner-sec-scanner-tier-v1.js'
      - 'functions/api/sec-issuer-research-v1.js'
      - 'functions/_lib/sec-scanner-tier-v1.js'
      - 'supabase/migrations/20261103_sec_scanner_tier_grants_v1.sql'
      - 'assets/js/crownlight-sec-scanner-tier-ui-v1.js'
      - 'assets/css/crownlight-sec-scanner-tier-ui-v1.css'
      - 'assets/js/advanced-tools.js'
      - 'advanced-tool.html'
      - 'tests/test_crownlight_sec_tier*.mjs'
      - 'data/crownlight-sec-scanner-tiers-v1.json'
      - '.github/workflows/crownlight-sec-scanner-tiers-batch2.yml'
  push:
    branches:
      - feature/crownlight-sec-tier-enforcement-batch2-20261103
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tier-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, functional tier access, hostile cases and original Watchlist SEC contract
        run: |
          node --check functions/_lib/sec-scanner-tier-v1.js
          node --check functions/api/sec-scanner-tier-v1.js
          node --check functions/api/sec-scanner-research-v1.js
          node --check functions/api/owner-sec-scanner-tier-v1.js
          node --check functions/api/sec-issuer-research-v1.js
          node --check assets/js/crownlight-sec-scanner-tier-ui-v1.js
          node --check assets/js/advanced-tools.js
          node --test tests/test_crownlight_sec_tier_grants_v1.mjs tests/test_crownlight_sec_tier_endpoints_v1.mjs tests/test_crownlight_sec_tier_ui_source_v1.mjs
          node tests/test_sec_issuer_research_v1.mjs
          node tests/test_crownlight_scanner_sec_evidence_v1.mjs
          node tests/test_crownlight_scanner_sec_brief_v4.mjs
          node --test tests/test_crownlight_sec_scanner_tiers_v1.mjs
          node tests/test_crownlight_scanner_integration_v4.mjs
      - name: Static Pages publication privacy
        run: |
          bash scripts/build-pages.sh
          test -s public/assets/js/crownlight-sec-scanner-tier-ui-v1.js
          test -s public/assets/css/crownlight-sec-scanner-tier-ui-v1.css
          test ! -e public/supabase/migrations/20261103_sec_scanner_tier_grants_v1.sql
          test ! -d public/functions
          test ! -d public/supabase
          test ! -e public/data/crownlight-sec-scanner-tiers-v1.json

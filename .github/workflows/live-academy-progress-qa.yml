# Manual-only authenticated production acceptance. Unlike source-only tests,
# this uses a real member and requires a separately Owner-authorized, active,
# expiring noncommercial ONDEMAND_TRAINING QA grant before dispatch.
# The accepted October 31 QA grant was intentionally revoked after its test.
# Never make unrelated source pushes fail because the QA entitlement expired.
# Authentication, entitlement and persistence checks remain fail-closed.
# No credentials, payment, grading, or role changes occur in this workflow.
name: Live Academy Persistence QA (authenticated, no billing)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-academy-progress-main
  cancel-in-progress: false
jobs:
  verify-member-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify genuine QA password auth, study save, revision CAS and token-refresh resume
        env:
          LAB_QA_EMAIL: ${{ secrets.LAB_QA_EMAIL }}
          LAB_QA_PASSWORD: ${{ secrets.LAB_QA_PASSWORD }}
        run: node tests/live-academy-progress-qa.mjs

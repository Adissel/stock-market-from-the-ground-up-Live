name: Learning Lab Quantitative Studies V1
on:
  push:
    branches: [main]
    paths:
      - 'assets/js/learning-quant-studies-v1.js'
      - 'assets/js/learning-indicators-v1.js'
      - 'tests/learning-indicators-v1.test.mjs'
      - 'tests/lab-bridge-batch03-v1.test.mjs'
      - 'tests/lab-bridge-batch04-source-v1.test.mjs'
      - 'tests/lab-batch04-echarts-v1.test.mjs'
      - 'assets/js/lab-batch04-echarts-v1.js'
      - 'assets/css/lab-batch04-echarts-v1.css'
      - 'data/lab-bridge-batch04-quant-fixtures-v1.json'
      - 'scripts/qa/lab_batch04_decimal_reference_v1.py'
      - 'data/lab-teaching-bridges-v014168.json'
      - 'scripts/qa/learning_indicator_decimal_reference_v1.py'
      - 'data/learning-engine-quant-source-registry-v1.json'
      - 'scripts/qa/learning_quant_decimal_reference_v1.py'
      - 'assets/js/learning-quant-studies-ui-v1.js'
      - 'assets/css/learning-quant-studies-v1.css'
      - 'assets/js/lab-engine-v32-universal.js'
      - 'lab-player.html'
      - 'tests/learning-quant-studies-v1.test.mjs'
      - '.github/workflows/learning-lab-quant-studies-v1.yml'
  workflow_dispatch:
jobs:
  approved-math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check assets/js/learning-quant-studies-v1.js
          node --check assets/js/learning-indicators-v1.js
          node --check assets/js/learning-quant-studies-ui-v1.js
          node --check assets/js/lab-batch04-echarts-v1.js
          node --check assets/js/lab-engine-v32-universal.js
      - name: Independent Python Decimal formula validation
        run: |
          python3 scripts/qa/learning_quant_decimal_reference_v1.py
          python3 scripts/qa/learning_indicator_decimal_reference_v1.py
          python3 scripts/qa/lab_batch04_decimal_reference_v1.py
      - name: Original quantitative research and safety contracts
        run: node --test tests/learning-quant-studies-v1.test.mjs tests/learning-evidence-diagnostic-v1.test.mjs tests/learning-indicators-v1.test.mjs tests/lab-bridge-batch03-v1.test.mjs tests/lab-bridge-batch04-source-v1.test.mjs tests/lab-batch04-echarts-v1.test.mjs

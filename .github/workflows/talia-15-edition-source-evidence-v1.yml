name: Talia Tutor 15 Edition Source Evidence - Release Holds
on:
  push:
    branches: [main]
    paths:
      - 'functions/_lib/talia-tier-remaining3-source-v1.js'
      - 'data/talia-four-edition-evidence-audit-v1.json'
      - 'tests/talia-tier-remaining3-source-v1.test.mjs'
      - 'tests/talia-owner-draft-and-edition-audit-v1.test.mjs'
      - 'scripts/qa/talia-owner-600-and-tiers-v1.mjs'
      - '.github/workflows/talia-15-edition-source-evidence-v1.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source syntax and release policy
        run: |
          node --check functions/_lib/talia-tier-remaining3-source-v1.js
          node --test tests/talia-tier-remaining3-source-v1.test.mjs tests/talia-tier-research-contracts-v1.test.mjs tests/talia-owner-draft-and-edition-audit-v1.test.mjs
      - name: Repeat evidence compilation with independent hold flags
        run: node scripts/qa/talia-owner-600-and-tiers-v1.mjs

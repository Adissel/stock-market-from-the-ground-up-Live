name: Boot Camp Foundations Days 1-20 Source Acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/academy-foundations-batch02-v1.yml'
      - 'functions/_lib/academy-foundations-batch02-v1.js'
      - 'functions/_lib/bootcamp-curriculum-v014144.js'
      - 'functions/_lib/bootcamp-academy-v014168.js'
      - 'assets/js/academy-guided-v1.js'
      - 'tests/test_academy_foundations_batch02_v1.mjs'
      - 'scripts/bootcamp-247-editorial-preflight-v1.mjs'
permissions: {contents: read}
jobs:
  canonical-30-day-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node tests/test_academy_foundations_batch02_v1.mjs
          node tests/test_academy_guided_v1.mjs
          node tests/test_bootcamp_first22_editorial_preflight_v1.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: foundations-batch02-curriculum-queue
          path: |
            artifacts/bootcamp-247-editorial-queue.csv
            artifacts/bootcamp-247-batch-manifest.json

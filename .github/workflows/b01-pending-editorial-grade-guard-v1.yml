name: B01 Pending Editorial Grade Guard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b01-pending-editorial-grade-guard-v1.yml'
      - 'functions/api/interactive-training.js'
      - 'functions/api/training-editor.js'
      - 'tests/test_b01_owner_rubric_independent_gate_v1.mjs'
      - 'tests/test_b01_owner_review_revision_cas.mjs'
      - 'tests/test_b01_pending_private_review_grading_gate_v1.mjs'
      - 'tests/test_v014100_choice_option_order.mjs'
      - 'tests/test_b01_private_option_feedback_v98_v1.mjs'
      - 'supabase/migrations/20261031_b01_private_feedback_v98_draft_only.sql'
      - 'tests/test_b01_review_withdrawal_and_private_grading.mjs'
      - 'tests/test_b01_invalid_choice_and_remediation.mjs'
permissions:
  contents: read
  issues: write
jobs:
  b01-protected-reviewed-vs-approved:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify B01 private grading remains closed without individual content acceptance
        run: |
          node --check functions/api/interactive-training.js
          node tests/test_v014100_choice_option_order.mjs
          node tests/test_b01_private_option_feedback_v98_v1.mjs
          node tests/test_b01_owner_rubric_independent_gate_v1.mjs
          node tests/test_b01_owner_review_revision_cas.mjs
          node tests/test_b01_pending_private_review_grading_gate_v1.mjs
          node tests/test_b01_review_withdrawal_and_private_grading.mjs
          node tests/test_b01_invalid_choice_and_remediation.mjs
      - name: Record exact B01 guard CI status, not independent editorial approval
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### B01 protected grading CI — exact revision"
            echo "Commit: \`$GITHUB_SHA\`"
            echo "GitHub Actions: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Job status: **$JOB_STATUS**"
            echo "Coverage: frozen/draft B01 Owner review guard, stale-revision CAS, specific wrong-option feedback and private grading denial."
            echo "Technical CI success is NOT a separately authenticated human reviewer sign-off. Private v98 remains unapproved; grading remains held."
          } >/tmp/b01-guard-ci.txt
          gh issue comment 153 --repo "$GITHUB_REPOSITORY" --body-file /tmp/b01-guard-ci.txt

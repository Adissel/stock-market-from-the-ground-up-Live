name: James_Test Chart Studio Restrictive STANDARD Auth QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chart-james-restrictive-standard-v1.yml'
      - 'tests/live-chart-james-restrictive-standard-v1.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standard-restrictive-real-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/live-chart-james-restrictive-standard-v1.mjs
      - name: Real QA member Standard restriction and workspace isolation (read only)
        env:
          LAB_QA_EMAIL: ${{ secrets.LAB_QA_EMAIL }}
          LAB_QA_PASSWORD: ${{ secrets.LAB_QA_PASSWORD }}
        run: node tests/live-chart-james-restrictive-standard-v1.mjs

name: Chart Auth and B01 Noncharging Source Preflight
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/test_chart_authenticated_manual_browser_v1.mjs'
      - 'tests/test_b01_truth5_source_preflight_v1.mjs'
      - '.github/workflows/chart-b01-acceptance-preflight-v1.yml'
permissions:
  contents: read
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify human-authenticated Chart browser harness syntax
        run: node --check tests/test_chart_authenticated_manual_browser_v1.mjs
      - name: Verify B01 five-day source cases and quantitative examples
        run: node tests/test_b01_truth5_source_preflight_v1.mjs
      - name: Preserve release boundaries
        run: echo "This is source and arithmetic QA, not actual member sign-in, protected grade, legal rights or full beta editorial acceptance. Human CAPTCHA-protected browser login remains required for Chart Studio."

# Historical RC13 authenticated QA evidence is accepted at GitHub run 41585492012.
# Never run automatically after the temporary access window closes. Manual reruns
# require a separately authorized fresh temporary beta cohort and expiring grants.
name: RC13 Two-Member Three-Program Authentic Academy API
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-member-trio:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse documented authenticated QA runner
        run: node --check tests/live-academy-two-member-three-programs-qa-v1.mjs
      - name: Manual-only six signed study API paths with separately authorized temporary rights
        env:
          LAB_QA_EMAIL: ${{ secrets.LAB_QA_EMAIL }}
          LAB_QA_PASSWORD: ${{ secrets.LAB_QA_PASSWORD }}
          LAB_QA_SECOND_EMAIL: ${{ secrets.LAB_QA_SECOND_EMAIL }}
          LAB_QA_SECOND_PASSWORD: ${{ secrets.LAB_QA_SECOND_PASSWORD }}
        run: node tests/live-academy-two-member-three-programs-qa-v1.mjs

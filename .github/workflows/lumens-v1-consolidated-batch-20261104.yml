name: Lumens V1 Consolidated Release Batch (noncharging)
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/lumens-v1-consolidated-batch-20261104.yml'
      - 'tests/lumens-v1-consolidated-20261104.mjs'
      - 'tests/lumens-v1-batch-readiness-20261104.mjs'
      - 'tests/lumens-v1-static-dashboard-wallet-contract.mjs'
      - 'assets/js/member-lumen-wallet-widget-v1.js'
      - 'dashboard.html'
      - 'tests/live-lumen-server-catalog-parity-v1.mjs'
      - 'tests/live-lumen-two-account-isolation-v1.mjs'
      - 'docs/qa/2026-11-04_LUMENS_V1_FULL_RELEASE_BATCH_AND_SIGNOFF.md'
      - 'supabase/qa/20261104_lumens_v1_full_release_read_only.sql'
      - 'functions/_lib/lumen-discount-policy-v1.js'
      - 'functions/_lib/lumen-learning-award-policy-v1.js'
      - 'functions/_lib/lumen-member-gifting-policy-v1.js'
      - 'functions/api/member-lumen-gifts.js'
      - 'functions/api/learning-reward-preview.js'
      - 'functions/api/member-lumen-checkout-quote.js'
      - 'functions/api/member-lumen-activity.js'
      - 'supabase/migrations/*lumen*.sql'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lumens-v1-${{ github.sha }}
  cancel-in-progress: false
jobs:
  consolidated-no-money-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, safe entrypoints, independent V1 release hold
        run: |
          node --check functions/api/member-lumen-gifts.js
          node --check functions/api/learning-reward-preview.js
          node --check functions/api/member-lumen-checkout-quote.js
          node --check tests/lumens-v1-consolidated-20261104.mjs
      - name: Full combined Lumens V1 source and mocked behavioral gates
        run: node tests/lumens-v1-consolidated-20261104.mjs
      - name: Audit complete 60-gate V1 register and fail-closed release status
        run: node tests/lumens-v1-batch-readiness-20261104.mjs
      - name: Static Dashboard balance, session isolation and rollover disclosure
        run: node tests/lumens-v1-static-dashboard-wallet-contract.mjs
      - name: Existing dedicated protected-grade, mixed-order and wallet tests
        run: |
          node tests/test_lumen_learning_gifts_and_academy_progress_v1.mjs
          node tests/test_lumen_immutable_grade_provenance_v1.mjs
          node tests/test_member_lumen_wallet_progress_gifts_v1.mjs
          node tests/test_lumen_mixed_checkout_quote_v1.mjs
          node tests/test_lumen_fully_paid_tool_v1.mjs
          node tests/test_lumen_bundle_stripe_test_shadow_v1.mjs
          node tests/test_lu301_live_lumen_webhook.mjs

  james-wallet-browser-live-smoke:
    # Genuine LAB_QA Supabase sign-in. Not final same-SHA deployment acceptance.
    # Read-only; no Stripe checkout, wallet changes, awards or member gifts.
    runs-on: ubuntu-latest
    needs: consolidated-no-money-regression
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require configured QA secrets before browser setup
        env:
          LAB_QA_EMAIL: ${{ secrets.LAB_QA_EMAIL }}
          LAB_QA_PASSWORD: ${{ secrets.LAB_QA_PASSWORD }}
        run: |
          if [[ -z "$LAB_QA_EMAIL" || -z "$LAB_QA_PASSWORD" ]]; then
            echo "::error::BLOCKED: Configure LAB_QA_EMAIL and LAB_QA_PASSWORD in GitHub Actions repository secrets. Never commit credentials."
            exit 1
          fi
      - name: Install Chromium for authenticated member verification
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Syntax of independent two-member isolation
        run: node --check tests/live-lumen-two-account-isolation-v1.mjs
      - name: Genuine James_Test production Dashboard wallet smoke (read only)
        env:
          LAB_QA_EMAIL: ${{ secrets.LAB_QA_EMAIL }}
          LAB_QA_PASSWORD: ${{ secrets.LAB_QA_PASSWORD }}
        run: node tests/live-member-lumen-dashboard-browser-v1.mjs
      - name: Genuine two-member private wallet and history isolation
        env:
          LAB_QA_EMAIL: ${{ secrets.LAB_QA_EMAIL }}
          LAB_QA_PASSWORD: ${{ secrets.LAB_QA_PASSWORD }}
          LAB_QA_SECOND_EMAIL: ${{ secrets.LAB_QA_SECOND_EMAIL }}
          LAB_QA_SECOND_PASSWORD: ${{ secrets.LAB_QA_SECOND_PASSWORD }}
        run: node tests/live-lumen-two-account-isolation-v1.mjs

  live-public-catalog-readonly:
    # Public live verification, no QA JWT, Stripe secret or payment mutation.
    # The separate manual release cut adds SMFGU_EXPECT_SHA after main is frozen.
    needs: consolidated-no-money-regression
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Live catalog, anonymous API denial and public noncash release guards
        shell: bash
        run: |
          for i in 1 2 3; do
            if node tests/live-lumen-server-catalog-parity-v1.mjs; then exit 0; fi
            if [[ "$i" != "3" ]]; then sleep 30; fi
          done
          exit 1

  exact-sha-full-release-cut:
    # Manual/frozen SHA only. Cannot pass while real James_Test browser gate fails.
    if: github.event_name == 'workflow_dispatch'
    needs: [consolidated-no-money-regression, live-public-catalog-readonly, james-wallet-browser-live-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact production manifest and public server catalog from immutable commit
        env:
          SMFGU_EXPECT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          for i in 1 2 3 4; do
            if node tests/live-lumen-server-catalog-parity-v1.mjs; then exit 0; fi
            if [[ "$i" != "4" ]]; then sleep 90; fi
          done
          exit 1

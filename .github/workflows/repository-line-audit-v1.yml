name: Whole Repository Tracked-File Line Audit V1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/repository-line-audit-v1.mjs'
      - '.github/workflows/repository-line-audit-v1.yml'
permissions:
  contents: read
  issues: write
jobs:
  audit-all-tracked-files:
    name: Noncharging all-file inventory and static line inspection
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scanner syntax
        run: node --check scripts/repository-line-audit-v1.mjs
      - name: Inventory every tracked file and statically scan all readable UTF-8 lines
        id: scan
        continue-on-error: true
        run: node scripts/repository-line-audit-v1.mjs
      - name: Upload complete audit evidence and individual file/line manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-line-audit-v1
          path: artifacts/repository-line-audit/
          if-no-files-found: error
          retention-days: 30
      - name: Publish sanitized audit inventory to tracking issue 158
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -f artifacts/repository-line-audit/summary.json; then
            node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('artifacts/repository-line-audit/summary.json','utf8'));
          const t=s.totals;
          const message=[
            '## Automated repository line-audit run — '+s.createdUtc,
            '**Exact SHA:** `'+s.auditedCommit+'`',
            '**Tracked files:** '+t.tracked+'; **UTF-8 text files:** '+t.textFiles+'; **text lines scanned:** '+t.textLines,
            '**Binary/non-UTF8 inventory-only:** '+t.binaryFiles+'; **symlinks:** '+t.symlinks+'; **unreadable:** '+t.unreadable,
            '**Node syntax checks:** '+t.syntaxChecked+'; **deferred oversized JS:** '+t.syntaxSkipped,
            '**JSON parsed:** '+t.jsonParsed+'; **JSON parse failures:** '+t.jsonFailed,
            '**Pattern findings:** '+s.findings+' (P0 '+s.bySeverity.P0+', P1 '+s.bySeverity.P1+', P2 '+s.bySeverity.P2+', P3 '+s.bySeverity.P3+')',
            '**Full file manifest, finding lines and summary:** Actions artifact `repository-line-audit-v1` for this commit.',
            'Scope: automated rules on every readable tracked text line; not independent semantic review, secrets review, binary inspection, browser authentication or release certification.'
          ].join('\n\n');
          fs.writeFileSync('artifacts/repository-line-audit/ISSUE_SUMMARY.md',message+'\n');
          NODE
            gh issue comment 158 --repo cybernexuspublishing/stock-market-from-the-ground-up --body-file artifacts/repository-line-audit/ISSUE_SUMMARY.md
          fi
      - name: Fail on scan integrity errors
        if: steps.scan.outcome != 'success'
        run: exit 1
      - name: State what this acceptance does not prove
        if: always()
        run: echo "This scans all git-tracked text lines with static rules. It does NOT certify human semantic review, binaries, Stripe LIVE, real-member auth, licensing, or final production acceptance."

name: Crownlight Prototype Real Member Denial
on:
  push:
    branches: [main]
    paths:
      - 'tests/prototype-live-member-denial-v3.mjs'
      - '.github/workflows/prototype-real-member-denial-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-nonstaff-denial:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real noncommercial QA member sign-in and Prototype API denial
        env:
          LAB_QA_EMAIL: ${{ secrets.LAB_QA_EMAIL }}
          LAB_QA_PASSWORD: ${{ secrets.LAB_QA_PASSWORD }}
        run: |
          node --check tests/prototype-live-member-denial-v3.mjs
          node tests/prototype-live-member-denial-v3.mjs

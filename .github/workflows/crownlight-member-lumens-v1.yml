# Coordinated V1 source release cut post home-terminal preservation, unchanged release permissions;
# technical regression acceptance only; grading, awards and V2 gifting stay disabled.
name: Crownlight Member Wallet, Progress and Gifting Safety V1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crownlight-member-lumens-v1.yml'
      - 'tests/test_member_lumen_wallet_progress_gifts_v1.mjs'
      - 'tests/test_filings7_issuer_cik_draft_v2.mjs'
      - 'tests/test_lumen_immutable_grade_provenance_v1.mjs'
      - 'supabase/migrations/20261102_lumen_immutable_grade_issuer_provenance_hardening_v1.sql'
      - 'supabase/migrations/20261102_filings7_d01_issuer_cik_draft_correction_v1.sql'
      - 'functions/api/member-lumen-gifts.js'
      - 'functions/api/learning-reward-preview.js'
      - 'assets/js/crownlight-learning-reward-badges-v1.js'
      - 'assets/css/crownlight-member-quickview-v1.css'
      - 'functions/api/member-lumen-activity.js'
      - 'functions/api/member-lumen-integrity.js'
      - 'functions/api/member-learning-quick-view.js'
      - 'functions/_lib/lumen-learning-award-policy-v1.js'
      - 'functions/_lib/lumen-member-gifting-policy-v1.js'
      - 'assets/js/crownlight-member-quickview-v1.js'
      - 'assets/js/crownlight-member-gifting-v1.js'
      - 'assets/js/site.js'
      - 'assets/js/navigation.js'
      - 'dashboard.html'
permissions:
  contents: read
jobs:
  verify-private-member-systems:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and disabled release controls
        run: |
          node --check assets/js/crownlight-member-quickview-v1.js
          node --check assets/js/crownlight-member-gifting-v1.js
          node --check functions/api/member-lumen-gifts.js
          node --check functions/api/learning-reward-preview.js
          node --check assets/js/crownlight-learning-reward-badges-v1.js
          node --check functions/api/member-lumen-activity.js
          node --check functions/api/member-lumen-integrity.js
          node --check functions/api/member-learning-quick-view.js
          node tests/test_member_lumen_wallet_progress_gifts_v1.mjs
          node tests/test_filings7_issuer_cik_draft_v2.mjs
          node tests/test_lumen_immutable_grade_provenance_v1.mjs

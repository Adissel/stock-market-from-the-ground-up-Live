# Free, no-charge targeted contract checks. Does not certify authenticated release.
name: Crownlight Shared ECharts Visual Contracts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crownlight-visual-kit-contract-v1.yml'
      - 'assets/js/crownlight-visual-kit-v1.js'
      - 'assets/js/free-foundations-echarts-v1.js'
      - 'assets/js/learning-progress-echarts-v1.js'
      - 'assets/js/crownlight-echarts-admin-v1.js'
      - 'admin.html'
      - 'tests/test_crownlight_admin_shared_analytics_browser_v1.mjs'
      - 'assets/js/crownlight-talia-echarts-bridge-v1.js'
      - 'assets/css/crownlight-talia-echarts-bridge-v1.css'
      - 'simulator.html'
      - 'verified-replay.html'
      - 'tests/test_crownlight_talia_echarts_bridge_v1.mjs'
      - 'tests/test_crownlight_talia_echarts_bridge_browser_v1.mjs'
      - 'assets/js/crownlight-tutor-chart-handoff-v1.js'
      - 'tests/test_crownlight_tutor_chart_handoff_v1.mjs'
      - 'tests/test_crownlight_tutor_chart_handoff_browser_v1.mjs'
      - 'market-tutor.html'
      - 'lab-player.html'
      - 'bootcamp-academy.html'
      - 'tests/test_learning_progress_echarts_v1.mjs'
      - 'tests/crownlight-visual-kit-v1.test.mjs'
      - 'tests/test_free_foundations_echarts_v1.mjs'
      - 'dashboard.html'
      - 'docs/engineering/SMFGU-VISUALIZATION-DATA-CONTRACT-v1.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crownlight-visual-kit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual-data-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate shared visualization scripts and replay cutoff contract
        run: |
          node --check assets/js/crownlight-visual-kit-v1.js
          node --check assets/js/free-foundations-echarts-v1.js
          node --check assets/js/learning-progress-echarts-v1.js
          node --check assets/js/crownlight-echarts-admin-v1.js
          node --check tests/crownlight-visual-kit-v1.test.mjs
          node tests/crownlight-visual-kit-v1.test.mjs
          node --check assets/js/crownlight-talia-echarts-bridge-v1.js
          node --check tests/test_crownlight_talia_echarts_bridge_v1.mjs
          node tests/test_crownlight_talia_echarts_bridge_v1.mjs
          node --check assets/js/crownlight-tutor-chart-handoff-v1.js
          node tests/test_crownlight_tutor_chart_handoff_v1.mjs

  visual-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned free browser runtime and local ECharts
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1 echarts@6.1.0
          npx playwright install --with-deps chromium
      - name: Run focused real ECharts Chromium suites
        run: |
          node tests/test_free_foundations_echarts_v1.mjs
          node tests/test_learning_progress_echarts_v1.mjs
          node tests/test_crownlight_admin_shared_analytics_browser_v1.mjs
          node tests/test_crownlight_talia_echarts_bridge_browser_v1.mjs
          node tests/test_crownlight_tutor_chart_handoff_browser_v1.mjs

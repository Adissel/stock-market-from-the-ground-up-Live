name: Academy First42 Source and Arithmetic Substantive Controls
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/academy-first42-substantive-source-controls-v1.yml'
      - 'scripts/academy-first42-substantive-source-controls-v1.mjs'
      - 'scripts/academy-first42-claim-inventory-v1.mjs'
      - 'functions/_lib/academy-first22-teaching-v1.js'
      - 'functions/_lib/academy-foundations-batch02-v1.js'
      - 'docs/research/stockstotrade/ACADEMY_FIRST42_NARROW_CLAIM_EVIDENCE_2026-10-31.csv'
permissions: {contents: read}
jobs:
  source-current-substantive-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check scripts/academy-first42-substantive-source-controls-v1.mjs
          node scripts/academy-first42-claim-inventory-v1.mjs
          node scripts/academy-first42-substantive-source-controls-v1.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: academy-first42-substantive-evidence-review-queue
          path: |
            artifacts/academy-first42-claim-substantive-control-audit.csv
            artifacts/academy-first42-source-control-day-register.csv
            artifacts/academy-first42-source-controls-result.json

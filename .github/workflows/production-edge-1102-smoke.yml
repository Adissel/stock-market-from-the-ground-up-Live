name: Cloudflare 1102 Production Readonly Smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-edge-1102-smoke.yml'
      - 'scripts/qa/production-edge-1102-smoke.mjs'
permissions:
  contents: read
jobs:
  readonly-public-http:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real public production smoke without authentication or writes
        run: node scripts/qa/production-edge-1102-smoke.mjs

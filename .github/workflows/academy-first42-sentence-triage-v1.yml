name: Academy First-42 Complete Sentence Triage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/academy-first42-sentence-triage-v1.yml'
      - 'scripts/academy-first42-evidence-triage-v1.mjs'
      - 'scripts/academy-first42-claim-inventory-v1.mjs'
      - 'scripts/academy-first42-substantive-source-controls-v1.mjs'
      - 'docs/research/stockstotrade/ACADEMY_FIRST42_NARROW_CLAIM_EVIDENCE_2026-10-31.csv'
      - 'functions/_lib/academy-first22-teaching-v1.js'
      - 'functions/_lib/academy-foundations-batch02-v1.js'
      - 'functions/_lib/bootcamp-academy-v014168.js'
permissions: {contents: read}
jobs:
  classify-all-940-without-editorial-autoapproval:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check scripts/academy-first42-claim-inventory-v1.mjs
          node --check scripts/academy-first42-evidence-triage-v1.mjs
          node scripts/academy-first42-claim-inventory-v1.mjs
          node scripts/academy-first42-evidence-triage-v1.mjs
          node scripts/academy-first42-substantive-source-controls-v1.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: academy-first42-940-sentence-reviewed-triage
          path: |
            artifacts/academy-first42-940-sentence-review-dispositions.csv
            artifacts/academy-first42-42-day-editorial-queue.csv
            artifacts/academy-first42-940-disposition-manifest.json
            artifacts/academy-first42-claim-substantive-control-audit.csv
            artifacts/academy-first42-source-control-day-register.csv
            artifacts/academy-first42-source-controls-result.json

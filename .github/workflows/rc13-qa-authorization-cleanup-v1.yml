name: RC13 Temporary Beta Authorization Cleanup Source Gate
on:
  push:
    branches: [main]
    paths:
      - 'functions/api/bootcamp-academy.js'
      - 'tests/test_rc13_expiring_qa_beta_source_v1.mjs'
      - '.github/workflows/rc13-qa-authorization-cleanup-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert original beta gating and no lingering temporary QA exception
        run: node tests/test_rc13_expiring_qa_beta_source_v1.mjs

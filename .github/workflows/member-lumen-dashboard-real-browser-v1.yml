name: Crownlight Genuine Member Wallet Dashboard Browser QA
on:
  push:
    branches: [main]
    paths:
      - 'tests/live-member-lumen-dashboard-browser-v1.mjs'
      - 'tests/live-lumen-two-account-isolation-v1.mjs'
      - 'dashboard.html'
      - 'assets/js/crownlight-member-quickview-v1.js'
      - 'assets/js/dashboard-ui-legacy.js'
      - 'assets/js/member-lumen-wallet-widget-v1.js'
      - 'functions/api/member-lumen-integrity.js'
      - '.github/workflows/member-lumen-dashboard-real-browser-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  james-wallet-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check noncharging QA source syntax
        run: node --check tests/live-member-lumen-dashboard-browser-v1.mjs
      - name: Require configured QA secrets before browser setup
        env:
          LAB_QA_EMAIL: ${{ secrets.LAB_QA_EMAIL }}
          LAB_QA_PASSWORD: ${{ secrets.LAB_QA_PASSWORD }}
        run: |
          if [[ -z "$LAB_QA_EMAIL" || -z "$LAB_QA_PASSWORD" ]]; then
            echo "::error::BLOCKED: Configure LAB_QA_EMAIL and LAB_QA_PASSWORD in GitHub Actions repository secrets. Never commit credentials."
            exit 1
          fi
      - name: Install free Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Syntax of independent two-member isolation
        run: node --check tests/live-lumen-two-account-isolation-v1.mjs
      - name: Test genuine James_Test wallet, progress, gifts-disabled and privacy UI
        env:
          LAB_QA_EMAIL: ${{ secrets.LAB_QA_EMAIL }}
          LAB_QA_PASSWORD: ${{ secrets.LAB_QA_PASSWORD }}
        run: node tests/live-member-lumen-dashboard-browser-v1.mjs

  two-member-wallet-isolation:
    needs: james-wallet-browser
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check separate genuine-member isolation source
        run: node --check tests/live-lumen-two-account-isolation-v1.mjs
      - name: Require second genuine QA account without logging secrets
        env:
          LAB_QA_SECOND_EMAIL: ${{ secrets.LAB_QA_SECOND_EMAIL }}
          LAB_QA_SECOND_PASSWORD: ${{ secrets.LAB_QA_SECOND_PASSWORD }}
        run: |
          if [[ -z "$LAB_QA_SECOND_EMAIL" || -z "$LAB_QA_SECOND_PASSWORD" ]]; then
            echo "::error::BLOCKED: Second authenticated QA identity must be configured for two-account isolation. Cannot certify without it."
            exit 1
          fi
      - name: Genuine two-member private wallet and history isolation
        env:
          LAB_QA_EMAIL: ${{ secrets.LAB_QA_EMAIL }}
          LAB_QA_PASSWORD: ${{ secrets.LAB_QA_PASSWORD }}
          LAB_QA_SECOND_EMAIL: ${{ secrets.LAB_QA_SECOND_EMAIL }}
          LAB_QA_SECOND_PASSWORD: ${{ secrets.LAB_QA_SECOND_PASSWORD }}
        run: node tests/live-lumen-two-account-isolation-v1.mjs

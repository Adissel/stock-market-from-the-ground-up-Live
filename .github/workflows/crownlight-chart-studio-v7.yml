# Noncharging 2026-10-30 owner acceptance sweep: execute existing QA on main; no payment or live member mutation.
name: Crownlight Chart Studio V7 Source-Scoped Workspace
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/api/chart-workspace.js'
      - 'assets/js/crownlight-workspace-v2.js'
      - 'simulator.html'
      - 'tests/test_crownlight_workspace_sources_v7.mjs'
      - 'tests/test_crownlight_workspace_sources_v7_browser.mjs'
      - 'tests/test_crownlight_chart_preferences_v16_browser.mjs'
      - 'assets/js/crownlight-chart-studio-v2.js'
      - 'tests/test_crownlight_chart_workspace_v2.mjs'
      - 'tests/test_crownlight_chart_tiers_v1.mjs'
      - 'tests/test_crownlight_chart_tiers_browser_v1.mjs'
      - 'tests/test_free_simulator_starter_v1.mjs'
      - 'tests/test_sellable_simulator_csv_integrity_v1.mjs'
      - 'tests/test_chart_mixed_contract_v1.mjs'
      - 'tests/test_chart_mixed_test_boundary_v1.mjs'
      - 'tests/test_stripe_test_unified_webhook_20261030.mjs'
      - 'tests/test_chart_mixed_cancel_card_mock_v1.mjs'
      - 'tests/test_crownlight_chart_pass_lifecycle_v5.mjs'
      - 'tests/test_chart_backend_outage_failclosed_v1.mjs'
      - 'tests/test_crownlight_advanced_downgrade_browser_v1.mjs'
      - '.github/workflows/crownlight-chart-studio-v7.yml'
permissions:
  contents: read
  issues: write
jobs:
  private-workspace-source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse and verify private normalization and existing secure workspaces
        run: |
          node --check functions/api/chart-workspace.js
          node --check assets/js/crownlight-workspace-v2.js
          node tests/test_crownlight_workspace_sources_v7.mjs
          node tests/test_crownlight_chart_workspace_v2.mjs
          node tests/test_crownlight_chart_tiers_v1.mjs
          node tests/test_chart_backend_outage_failclosed_v1.mjs
          node tests/test_crownlight_chart_studio_v3_integrity.mjs
          node tests/test_crownlight_chart_entitlement_continuity_v4.mjs
          node tests/test_crownlight_chart_provider_inventory_v6.mjs
          node tests/test_v014145_marketdata_byo_security.mjs
      - name: Chart Studio release V1 financial, CSV and rights boundaries (fixture-only)
        run: |
          node tests/test_free_simulator_starter_v1.mjs
          node tests/test_sellable_simulator_csv_integrity_v1.mjs
          node tests/test_crownlight_chart_pass_lifecycle_v5.mjs
          node tests/test_chart_mixed_contract_v1.mjs
          node tests/test_chart_mixed_test_boundary_v1.mjs
          node tests/test_chart_mixed_cancel_card_mock_v1.mjs
          node tests/test_stripe_test_unified_webhook_20261030.mjs
      - name: Verify no private backend code/secret bundled in Pages
        run: |
          bash scripts/build-pages.sh
          test -f public/assets/js/crownlight-workspace-v2.js
          test -f public/simulator.html
          test ! -d public/functions
          test ! -e public/supabase
  chromium-private-dataset-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install no-cost pinned Chromium and existing charting dependencies
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1 klinecharts@10.1.0 lightweight-charts@5.2.1
          npx playwright install --with-deps chromium
      - name: Test independent symbol collections, save/restore, and sign-out scrub
        run: node tests/test_crownlight_workspace_sources_v7_browser.mjs
      - name: Test actual member chart appearance, save/restore across independent browser contexts, no-lookahead, and revision conflicts
        run: node tests/test_crownlight_chart_preferences_v16_browser.mjs
      - name: Verify Advanced restores safely from expired Professional workspace (fixture-only Chromium)
        run: node tests/test_crownlight_advanced_downgrade_browser_v1.mjs
      - name: Verify full Standard Advanced Professional browser fixture matrix
        run: node tests/test_crownlight_chart_tiers_browser_v1.mjs
      - name: Preserve original Professional synchronization and provider integration
        run: |
          node tests/test_crownlight_workspace_sync_v6_browser.mjs
          node tests/test_crownlight_chart_studio_v3_browser.mjs
          node tests/test_crownlight_source_to_chart_v5_browser.mjs
      - name: Record offline Chromium result with fixture-only classification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Advanced Chart Studio fixture-only Chromium — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "Commit: \`$GITHUB_SHA\`"
            echo "GitHub Actions: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Job status: **$QA_JOB_STATUS**"
            echo "Coverage: Advanced downshift workspace restore, reload, locked Professional layout and preserved saved studies, plus existing studio browser regressions."
            echo "Classification: **MOCKED Chromium**, not an authenticated production browser. No payment, wallet or member workspace writes."
          } > /tmp/chart-fixture-qa.md
          # The Actions step summary is the durable report. The historical
          # tracking issue may not exist in this repository, so comments
          # are optional and must not turn passing tests into a failed job.
          cat /tmp/chart-fixture-qa.md >> "$GITHUB_STEP_SUMMARY"
          if gh issue view 154 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh issue comment 154 --repo "$GITHUB_REPOSITORY" --body-file /tmp/chart-fixture-qa.md ||
              echo "::warning::Fixture-only summary recorded, optional issue comment failed."
          else
            echo "::notice::Fixture-only summary recorded; historical issue #154 is absent."
          fi

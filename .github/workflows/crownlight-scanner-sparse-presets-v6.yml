name: Crownlight Scanner V6 - Sparse Presets and Input Evidence
on:
  pull_request:
  push:
    branches: [main, feature/crownlight-scanner-sparse-preset-coverage-20261104]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sparse-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict scripts and source-only numeric contracts
        run: |
          node --check assets/js/market-research-engine-v014145.js
          node --check assets/js/crownlight-scanner-rules-v1.js
          node --check assets/js/advanced-tools.js
          node --check assets/js/crownlight-scanner-visual-v1.js
          node --check assets/js/crownlight-scanner-evidence-v6.js
          node --test tests/test_crownlight_scanner_sparse_v6.mjs tests/test_crownlight_scanner_sparse_source_v6.mjs
          node tests/test_crownlight_scanner_rules_v1.mjs
          node tests/test_crownlight_scanner_results_v2.mjs
          node tests/test_crownlight_scanner_view_source_v2.mjs
          node tests/test_crownlight_scanner_templates_v1.mjs
          node --test tests/test_crownlight_scanner_presets_v2.mjs tests/test_crownlight_scanner_presets_ui_source_v2.mjs
          node tests/test_v014145_research_scanner.mjs
          node tests/test_v014150_scanner_filters.mjs
          node tests/test_crownlight_scanner_integration_v4.mjs
      - name: Static Pages build and source exclusion
        run: |
          bash scripts/build-pages.sh
          test -s public/assets/js/crownlight-scanner-evidence-v6.js
          test -s public/assets/css/crownlight-scanner-evidence-v6.css
          test ! -f public/tests/test_crownlight_scanner_sparse_v6.mjs
          test ! -d public/functions
          test ! -d public/supabase
